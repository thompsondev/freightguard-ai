[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freightguard-ai"
version = "0.1.0"
description = "Turn messy freight documents into typed data and explainable decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Thompson" }]
dependencies = [
  "openai>=1.68.0",
  "pydantic>=2.10.0",
  "pypdf>=5.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
freightguard = "freightguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freightguard"]

[tool.pytest.ini_options]
addopts = "-q --cov=freightguard --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

